<svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background square with rounded corners -->
  <rect width="200" height="200" rx="40" fill="#1E1E1C"/>
  
  <!-- Subtle top-left gradient accent -->
  <rect width="200" height="200" rx="40" fill="url(#bgGrad)" opacity="0.6"/>
  
  <!-- Thin border -->
  <rect x="1" y="1" width="198" height="198" rx="39" stroke="#C4973A" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Play triangle icon — centered, slightly upper area -->
  <path d="M78 72 L78 128 L136 100 Z" fill="#C4973A"/>
  
  <!-- Thin oxblood underline bar -->
  <rect x="40" y="148" width="120" height="3" rx="1.5" fill="#6F2832" opacity="0.9"/>

  <!-- Gradient definitions -->
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6F2832" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#1E1E1C" stop-opacity="0"/>
    </linearGradient>
  </defs>
</svg>
