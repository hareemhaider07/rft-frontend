  <!-- Entertainment — light weight, spaced caps -->
  <text x="114" y="30"
        font-family="'Inter', system-ui, sans-serif"
        font-size="9.5" font-weight="500"
        fill="#C4973A"
        letter-spacing="4">ENTERTAIN</text>
  <text x="114" y="46"
        font-family="'Inter', system-ui, sans-serif"
        font-size="9.5" font-weight="500"
        fill="#C4973A"
        letter-spacing="4">MENT</text>
</svg>
